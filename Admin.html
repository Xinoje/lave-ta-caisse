<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Réservations – Lave ta caisse</title>
<style>
:root{--bg:#000;--card:#0f1416;--line:#1d2a2d;--cy:#5ce1e6;--tx:#fff;--mut:#9fb0b3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1200px;margin:0 auto;padding:20px 14px 40px}
h1{margin:0 0 14px;color:var(--cy);font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:420px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:#000;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
.b{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--cy);color:#000;margin-top:12px}
.b.g{background:transparent;color:var(--tx);border:1px solid var(--line);margin-top:0}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{flex:0 0 auto;background:#000;color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font:inherit;cursor:pointer}
.tab.on{background:var(--cy);color:#000;font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}
th{position:sticky;top:0;background:var(--card);color:var(--mut);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#0b1012}
td small{display:block;color:var(--mut);margin-top:2px}
a{color:var(--cy)}
.price{color:var(--cy);font-weight:700;white-space:nowrap}
.ph{display:flex;gap:6px;flex-wrap:wrap;min-width:150px}
.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.none{color:var(--mut)}
.err{color:#ff8080;font-size:13px;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="w">
<h1>Réservations</h1>
<div id="lg" class="card">
<label for="em">E-mail</label><input id="em" type="email" value="Abdul.glzd@gmail.com">
<label for="pw">Mot de passe</label><input id="pw" type="password">
<button class="b" id="go">Se connecter</button>
<div id="msg" class="err"></div>
</div>
<div id="app" class="hide">
<div class="bar"><input id="q" placeholder="Rechercher (nom, tél, véhicule…)"><button class="b g" id="rf">Actualiser</button><button class="b g" id="lo">Quitter</button></div>
<div class="tabs" id="tabs"></div>
<div class="tw"><table>
<thead><tr><th>Créneau</th><th>Client</th><th>Prestation</th><th>Véhicule et lieu</th><th>Photos</th><th>Statut</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
<p id="empty" class="none hide">Aucune réservation.</p>
</div>
</div>
<script>
var SB="https://mamprtsdnqyddszmtxny.supabase.co",KEY="sb_publishable_VKgw9KuUNnZvHQaClL5bQA_rxVrgj8i",T="",ALL=[],FT="tous";

.then(function(r){return r.json()}).then(function(d){if(!d.access_token){$("msg").textContent="E-mail ou mot de passe incorrect.";return}T=d.access_token;try{sessionStorage.setItem("ltc_t",T)}catch(e){}start()})
.catch(function(){$("msg").textContent="Connexion impossible."})};
function start(){$("msg").textContent="";$("lg").classList.add("hide");$("app").classList.remove("hide");load()}
function out(){T="";try{sessionStorage.removeItem("ltc_t")}catch(e){}$("app").classList.add("hide");$("lg").classList.remove("hide");$("pw").value=""}
$("lo").onclick=out;$("rf").onclick=load;$("q").oninput=draw;
function load(){fetch(SB+"/rest/v1/reservations?select=*&order=created_at.desc",{headers:H()})
.then(function(r){if(r.status===401){out();throw 0}return r.json()}).then(function(d){ALL=Array.isArray(d)?d:[];draw()}).catch(function(){})}
function sign(p){return fetch(SB+"/storage/v1/object/sign/photos/"+p,{method:"POST",headers:H(true),body:JSON.stringify({expiresIn:3600})}).then(function(r){return r.json()}).then(function(d){return SB+"/storage/v1"+d.signedURL})}
function draw(){
var tb=$("tabs");tb.innerHTML="";
[["tous","Tous"]].concat(ST).forEach(function(t){var n=t[0]==="tous"?ALL.length:ALL.filter(function(x){return st(x)===t[0]}).length;var b=el("button","tab"+(FT===t[0]?" on":""),t[1]+" ("+n+")");b.onclick=function(){FT=t[0];draw()};tb.appendChild(b)});
var q=$("q").value.toLowerCase(),B=$("rows");B.innerHTML="";

$("empty").classList.toggle("hide",rows.length>0);
rows.forEach(function(x){B.appendChild(row(x))})}
function row(x){
var tr=el("tr");

var c3=el("td");c3.appendChild(el("div","",x.formule||""));c3.appendChild(el("small","",x.etat||""));c3.appendChild(el("div","price",x.prix!=null?x.prix+" €":""));tr.appendChild(c3);
var c4=el("td");c4.appendChild(el("div","",(x.vehicule||"")+" ("+(x.taille||"")+")"));var l=el("a","","🗺️ "+(x.lieu||""));l.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x.lieu||"");l.target="_blank";l.rel="noopener";l.style.display="block";c4.appendChild(l);if(x.remarque)c4.appendChild(el("small","","Remarque : "+x.remarque));tr.appendChild(c4);
var c5=el("td"),ph=el("div","ph");if(!(x.photos||[]).length)ph.appendChild(el("span","none","Aucune"));
(x.photos||[]).forEach(function(p){sign(p).then(function(u){var i=el("img");i.src=u;i.alt="Photo du véhicule";i.onclick=function(){window.open(u,"_blank")};ph.appendChild(i)}).catch(function(){})});c5.appendChild(ph);tr.appendChild(c5);
var c6=el("td"),s=el("select");ST.forEach(function(t){var o=el("option","",t[1]);o.value=t[0];if(st(x)===t[0])o.selected=true;s.appendChild(o)});
s.onchange=function(){fetch(SB+"/rest/v1/reservations?id=eq."+x.id,{method:"PATCH",headers:H(true),body:JSON.stringify({statut:s.value})}).then(function(r){if(r.ok){x.statut=s.value;draw()}else alert("Modification impossible.")})};
c6.appendChild(s);tr.appendChild(c6);
var c7=el("td"),d=el("button","b g","Supprimer");
d.onclick=function(){if(!confirm("Supprimer définitivement cette réservation et ses photos ?"))return;
var ps=x.photos||[];
(ps.length?fetch(SB+"/storage/v1/object/photos",{method:"DELETE",headers:H(true),body:JSON.stringify({prefixes:ps})}):Promise.resolve()).catch(function(){})
.then(function(){return fetch(SB+"/rest/v1/reservations?id=eq."+x.id,{method:"DELETE",headers:H(true)})})
.then(function(r){if(r.ok){ALL=ALL.filter(function(y){return y.id!==x.id});draw()}else alert("Suppression impossible.")})};
c7.appendChild(d);tr.appendChild(c7);
return tr}
try{T=sessionStorage.getItem("ltc_t")||""}catch(e){}
if(T)start();
</script>
</body>
</html>
